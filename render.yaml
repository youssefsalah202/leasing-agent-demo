# Render Blueprint — https://render.com/docs/infrastructure-as-code
#
# Deploy: on render.com, "New +" -> "Blueprint" -> connect this repo. Render
# reads this file and creates the service below automatically. You'll be
# prompted to paste ANTHROPIC_API_KEY into Render's dashboard during setup
# (sync: false below means it's never stored in this file or in git).
#
# Free tier has no persistent disk, so data/crm_store.json and the
# conversation logs reset whenever the service restarts (after ~15 min
# idle, or on redeploy) — expected for a demo, not a bug. The FAQ vector
# index is rebuilt at BUILD time (see buildCommand) so it survives restarts
# without re-downloading the embedding model on every cold start.

services:
  - type: web
    name: leasing-agent-demo
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/seed_faq_index.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: PYTHON_VERSION
        value: 3.11.9
